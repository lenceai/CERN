[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cern-mag-llmops"
version = "0.1.0"
description = "LLMOps framework for CERN Courier ingestion, retrieval, and model serving."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "CERN Magazine LLMOps Contributors" },
]
dependencies = [
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
  "langchain>=0.1.0",
  "langchain-openai>=0.0.1",
  "langchain-community>=0.0.1",
  "langchain-core>=0.1.0",
  "pypdf>=3.17.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "scikit-learn>=1.3.0",
  "matplotlib>=3.7.0",
  "seaborn>=0.12.0",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "tqdm>=4.66.0",
  "chromadb>=0.4.22",
  "fastapi>=0.104.0",
  "uvicorn>=0.24.0",
  "pydantic>=2.4.0",
  "tiktoken>=0.5.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.9.0",
  "mypy>=1.11.0",
  "types-requests>=2.32.0.20241016",
]

[project.scripts]
cern-mag-llmops = "cern_mag_llmops.utils.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cern_mag_llmops*"]
exclude = ["tests*", "notebooks*"]
